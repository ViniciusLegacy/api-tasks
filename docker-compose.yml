services:
  api:
    build: .
    image: nodejs
    container_name: api
    ports:
      - "3333:3333"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/api-tasks
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api-tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api-tasks"]
      interval: 5s
      retries: 10

volumes:
  pgdata: